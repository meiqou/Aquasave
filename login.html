<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in | AquaSave</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="depth" aria-hidden="true"><i class="d1" style="opacity:.65"></i><i class="d2" style="opacity:.55"></i></div>
<div id="bubbles" aria-hidden="true"></div>

<div class="page-shell">
  <nav class="dash-nav">
    <a class="brand" href="index.html"><img src="images/graphics/logo/ASAVE.png" alt="AquaSave"></a>
    <span class="nav-right">
      <a class="btn ghost sm" href="register.html">Create account</a>
    </span>
  </nav>

  <main class="auth-main">
      <div class="auth-card field-login">
        <h1>Welcome back</h1>
        <p>Sign in to your account</p>

        <form id="loginForm" novalidate>
          <div class="fgroup">
            <label for="loginEmail">Email</label>
            <input id="loginEmail" name="email" type="email" autocomplete="email" required>
          </div>

          <div class="fgroup">
            <label for="loginPassword">Password</label>
            <div class="pw-wrap">
              <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
              <button type="button" class="pw-toggle" id="togglePw">Show</button>
            </div>
          </div>

          <button type="submit" class="btn-pill-blue">Log in</button>
        </form>
        <p id="authMsg" class="auth-msg" aria-live="polite"></p>

        <p class="bottom-switch">No account? <a href="register.html">Create account</a></p>
      </div>
  </main>

  <footer>&copy; 2026 AquaSave</footer>
</div>

<script>
(function(){
  var pwInput = document.getElementById('loginPassword');
  var toggleBtn = document.getElementById('togglePw');
  var form = document.getElementById('loginForm');
  var msg = document.getElementById('authMsg');
  function setMsg(text, type){ msg.textContent = text || ''; msg.className = 'auth-msg' + (type ? ' ' + type : ''); }
  function getAccounts(){ try { return JSON.parse(localStorage.getItem('aquasave_accounts') || '[]'); } catch(e){ return []; } }
  toggleBtn.addEventListener('click', function(){
    var isPw = pwInput.type === 'password';
    pwInput.type = isPw ? 'text' : 'password';
    toggleBtn.textContent = isPw ? 'Hide' : 'Show';
  });
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var email = (document.getElementById('loginEmail').value || '').trim().toLowerCase();
    var password = pwInput.value || '';
    if(!email || !password){ setMsg('Please enter your email and password.', 'error'); return; }
    var accounts = getAccounts();
    var user = null;
    for(var i=0;i<accounts.length;i++){ if(accounts[i].email === email && accounts[i].password === password){ user = accounts[i]; break; } }
    if(!user){ setMsg('Invalid email or password.', 'error'); return; }
    localStorage.setItem('aquasave_session', JSON.stringify({ email: user.email, name: user.name, loggedIn: true }));
    var profile = {};
    try { profile = JSON.parse(localStorage.getItem('aquasave_profile') || '{}') || {}; } catch(err){ profile = {}; }
    profile.name = user.name;
    profile.email = user.email;
    localStorage.setItem('aquasave_profile', JSON.stringify(profile));
    setMsg('Logged in. Redirecting...', 'success');
    setTimeout(function(){ window.location.href = 'index.html'; }, 500);
  });
})();
</script>
</body>
</html>
