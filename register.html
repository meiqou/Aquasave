<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Become a Guardian | AquaSave</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="depth" aria-hidden="true"><i class="d1" style="opacity:.65"></i><i class="d2" style="opacity:.55"></i></div>
<div id="bubbles" aria-hidden="true"></div>

<div class="page-shell">
  <nav class="dash-nav">
    <a class="brand" href="index.html"><img src="images/graphics/logo/ASAVE.png" alt="AquaSave"></a>
    <span class="nav-right">
      <a class="btn ghost sm" href="login.html">Log in</a>
    </span>
  </nav>

  <main class="auth-main">
      <div class="auth-card field-login">
        <h1>Create account</h1>

        <form id="registerForm" novalidate>
          <div class="fgroup">
            <label for="regName">Full name</label>
            <input id="regName" name="name" type="text" autocomplete="name" required>
          </div>

          <div class="fgroup">
            <label for="regEmail">Email</label>
            <input id="regEmail" name="email" type="email" autocomplete="email" required>
          </div>

          <div class="fgroup">
            <label for="regPassword">Password</label>
            <div class="pw-wrap">
              <input id="regPassword" name="password" type="password" placeholder="8+ characters" autocomplete="new-password" required>
              <button type="button" class="pw-toggle" id="togglePw">Show</button>
            </div>
          </div>

          <button type="submit" class="btn-pill-blue">Create account</button>
        </form>
        <p id="authMsg" class="auth-msg" aria-live="polite"></p>

        <p class="bottom-switch">Have an account? <a href="login.html">Log in</a></p>
      </div>
  </main>

  <footer>&copy; 2026 AquaSave</footer>
</div>

<script>
(function(){
  var pwInput = document.getElementById('regPassword');
  var toggleBtn = document.getElementById('togglePw');
  var form = document.getElementById('registerForm');
  var msg = document.getElementById('authMsg');
  function setMsg(text, type){ msg.textContent = text || ''; msg.className = 'auth-msg' + (type ? ' ' + type : ''); }
  function getAccounts(){ try { return JSON.parse(localStorage.getItem('aquasave_accounts') || '[]'); } catch(e){ return []; } }
  function saveAccounts(a){ localStorage.setItem('aquasave_accounts', JSON.stringify(a)); }
  toggleBtn.addEventListener('click', function(){
    var isPw = pwInput.type === 'password';
    pwInput.type = isPw ? 'text' : 'password';
    toggleBtn.textContent = isPw ? 'Hide' : 'Show';
  });
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var name = (document.getElementById('regName').value || '').trim();
    var email = (document.getElementById('regEmail').value || '').trim().toLowerCase();
    var password = pwInput.value || '';
    if(!name || !email || !password){ setMsg('Please fill out all fields.', 'error'); return; }
    if(password.length < 8){ setMsg('Password must be at least 8 characters.', 'error'); return; }
    var accounts = getAccounts();
    for(var i=0;i<accounts.length;i++){ if(accounts[i].email === email){ setMsg('An account with this email already exists.', 'error'); return; } }
    accounts.push({ name: name, email: email, password: password });
    saveAccounts(accounts);
    localStorage.setItem('aquasave_session', JSON.stringify({ email: email, name: name, loggedIn: true }));
    var profile = {};
    try { profile = JSON.parse(localStorage.getItem('aquasave_profile') || '{}') || {}; } catch(err){ profile = {}; }
    profile.name = name; profile.email = email;
    localStorage.setItem('aquasave_profile', JSON.stringify(profile));
    setMsg('Account created. Redirecting...', 'success');
    setTimeout(function(){ window.location.href = 'dashboard.html'; }, 600);
  });
})();
</script>
</body>
</html>
